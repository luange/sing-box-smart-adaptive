name: Adaptive Linux Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string baked into binary (ldflags)"
        required: true
        type: string
        default: "1.14.0-beta.3-reF1nd-luan-adaptive.rc31-probe-hygiene"
      run_tests:
        description: "Run adaptive package tests before build"
        required: false
        type: boolean
        default: true
      publish_release:
        description: "Create GitHub release with artifacts"
        required: false
        type: boolean
        default: true
  push:
    branches:
      - "adaptive/**"
      - "rc*-beta3-adaptive"
    paths:
      - "protocol/group/adaptive/**"
      - "adapter/**"
      - "experimental/clashapi/**"
      - ".github/workflows/adaptive-linux-build.yml"

permissions:
  contents: write

concurrency:
  group: adaptive-linux-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  test-and-build:
    name: Test + linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f release/DEFAULT_BUILD_TAGS_OTHERS ]]; then
            tags="$(tr -d '\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          else
            tags="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "BUILD_TAGS=$tags" >> "$GITHUB_ENV"
          ldflags_shared=""
          if [[ -f release/LDFLAGS ]]; then
            ldflags_shared="$(tr -d '\n' < release/LDFLAGS)"
          fi
          echo "LDFLAGS_SHARED=$ldflags_shared" >> "$GITHUB_ENV"

      - name: Adaptive unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        # Only once on amd64 runner
        run: |
          if [[ "${{ matrix.goarch }}" != "amd64" ]]; then
            echo "skip tests on ${{ matrix.goarch }}"
            exit 0
          fi
          go test -count=1 -timeout 15m \
            -tags "$BUILD_TAGS" \
            -ldflags "$LDFLAGS_SHARED" \
            ./protocol/group/adaptive/...

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          else
            short="$(git rev-parse --short HEAD)"
            base="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0-dev)"
            ver="${base#v}-${short}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build sing-box
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/sing-box-${GOOS}-${GOARCH}"
          go build -trimpath \
            -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "$out" ./cmd/sing-box
          chmod +x "$out"
          # sanity: file type
          file "$out" || true
          sha256sum "$out" | tee "dist/sing-box-${GOOS}-${GOARCH}.sha256"
          # only amd64 can execute version on runner
          if [[ "$GOARCH" == "amd64" ]]; then
            "$out" version | tee dist/version.txt
          fi
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-${{ matrix.goarch }}
          path: |
            dist/sing-box-linux-${{ matrix.goarch }}
            dist/sing-box-linux-${{ matrix.goarch }}.sha256
            dist/version.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: test-and-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack release files
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ver=""
          if [[ -f artifacts/sing-box-linux-amd64/version.txt ]]; then
            ver="$(grep -m1 'sing-box version ' artifacts/sing-box-linux-amd64/version.txt | sed 's/^sing-box version //' || true)"
          fi
          if [[ -z "$ver" ]]; then
            ver="${{ inputs.version }}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # flatten
          find artifacts -type f -name 'sing-box-*' -print
          for arch in amd64 arm64; do
            src="artifacts/sing-box-linux-${arch}/sing-box-linux-${arch}"
            test -f "$src"
            cp -f "$src" "release/sing-box-linux-${arch}"
            (cd release && sha256sum "sing-box-linux-${arch}" > "sing-box-linux-${arch}.sha256")
            tar -C release -czf "release/sing-box-linux-${arch}.tar.gz" "sing-box-linux-${arch}"
          done
          cat > release/BUILD-INFO.md <<EOF
          # Adaptive build

          - Version: \`${ver}\`
          - Commit: \`${{ github.sha }}\`
          - Repo: \`${{ github.repository }}\`
          - Workflow: Adaptive Linux Build
          - Tags: DEFAULT_BUILD_TAGS_OTHERS
          - CGO: 0
          EOF
          ls -lh release/
          echo "tag=adaptive-${ver}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ steps.pack.outputs.version }}
          body: |
            Adaptive Pool production build (GitHub Actions).

            - version: `${{ steps.pack.outputs.version }}`
            - commit: `${{ github.sha }}`
            - linux/amd64 + linux/arm64, CGO=0
          files: |
            release/sing-box-linux-amd64
            release/sing-box-linux-arm64
            release/sing-box-linux-amd64.tar.gz
            release/sing-box-linux-arm64.tar.gz
            release/sing-box-linux-amd64.sha256
            release/sing-box-linux-arm64.sha256
            release/BUILD-INFO.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
