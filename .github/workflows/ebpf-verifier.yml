name: Verify eBPF program loading

on:
  workflow_dispatch:
  push:
    branches:
      - adaptive/beta12-smart-mem9
    paths:
      - '.github/workflows/ebpf-verifier.yml'
      - 'common/ebpf/**'
      - 'protocol/ebpf/**'
      - 'common/interrupt/**'
      - 'protocol/group/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/ebpf-verifier.yml'
      - 'common/ebpf/**'
      - 'protocol/ebpf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Linux kernel verifier (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - system-clang
          - ndk-r29-clang21
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit and race gates
        run: |
          go test ./common/interrupt ./protocol/group -count=1
          go test -race ./common/interrupt ./protocol/group -count=1

      - name: Setup Android NDK
        if: matrix.toolchain == 'ndk-r29-clang21'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Generate eBPF objects with system Clang
        if: matrix.toolchain == 'system-clang'
        env:
          BPF_CLANG: clang
        run: |
          "$BPF_CLANG" --version | tee verifier.log
          make -C common/ebpf generate
          go clean -cache

      - name: Generate eBPF objects with NDK r29 Clang 21
        if: matrix.toolchain == 'ndk-r29-clang21'
        env:
          BPF_CLANG: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
        run: |
          "$BPF_CLANG" --version | tee verifier.log
          make -C common/ebpf generate
          go clean -cache

      - name: Load program matrix
        shell: bash
        run: |
          set -euo pipefail
          cgroup_path=/sys/fs/cgroup/sing-box-ebpf-verifier
          sudo mkdir "$cgroup_path"
          trap 'sudo rmdir "$cgroup_path"' EXIT
          sudo env \
            "PATH=$PATH" \
            SING_BOX_EBPF_INTEGRATION=1 \
            SING_BOX_EBPF_INTEGRATION_CGROUP="$cgroup_path" \
            go test -v -count=1 \
              -run '^TestBackendProgramLoadIntegration$' \
              -tags with_ebpf,ebpf_integration \
              ./common/ebpf 2>&1 | tee -a verifier.log

      - name: Build Linux validation core
        if: matrix.toolchain == 'system-clang'
        env:
          CGO_ENABLED: '1'
        run: |
          go build -trimpath \
            -tags with_ebpf,with_gvisor,with_quic,with_wireguard,with_clash_api,with_tailscale,with_utls \
            -o sing-box-v2-linux-amd64 ./cmd/sing-box
          sha256sum sing-box-v2-linux-amd64 | tee sing-box-v2-linux-amd64.sha256

      - name: Upload validation core
        if: matrix.toolchain == 'system-clang'
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-v2-linux-amd64-${{ github.sha }}
          path: |
            sing-box-v2-linux-amd64
            sing-box-v2-linux-amd64.sha256
          retention-days: 14

      - name: Upload verifier log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-verifier-${{ matrix.toolchain }}
          path: verifier.log
          if-no-files-found: warn
          retention-days: 14
