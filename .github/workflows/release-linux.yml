name: Release Linux Binaries

# Gateway eBPF builds for amd64/arm64 on glibc and musl.
# Trigger: tag v* or manual dispatch.

on:
  push:
    tags:
      - "v1.14.0-rc.1-official-smart-ebpf*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version baked into binary (empty = git describe / tag)"
        required: false
        type: string
      publish_release:
        description: "Upload GitHub Release assets"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  ebpf:
    name: ebpf linux/${{ matrix.goarch }}/${{ matrix.libc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm make pkg-config libelf-dev zlib1g-dev linux-libc-dev
          if [[ "${{ matrix.goarch }}" == "arm64" ]]; then
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Validate committed v2 eBPF provenance
        run: |
          set -euo pipefail
          # This runs before generation and verifies the object embedded by
          # go:embed was produced from the checked-in v2 sources.  It avoids
          # the stale-object gap without requiring byte identity across the
          # different Clang toolchains used for release targets.
          make -C common/ebpf check-v2-source

      - name: Generate eBPF objects
        run: |
          set -euo pipefail
          make -C common/ebpf generate
          ls -la common/ebpf/native/*.o

      - name: Build Zig Smart policy library
        working-directory: smart-engine
        run: |
          set -euo pipefail
          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            zig_target="x86_64-linux-musl"
            if [[ "${{ matrix.goarch }}" == "arm64" ]]; then zig_target="aarch64-linux-musl"; fi
          else
            zig_target="x86_64-linux-gnu"
            if [[ "${{ matrix.goarch }}" == "arm64" ]]; then zig_target="aarch64-linux-gnu"; fi
          fi
          zig build -Dtarget="$zig_target" -Dcpu=baseline -Doptimize=ReleaseFast
          test -s zig-out/lib/libsmart_engine.a
          file zig-out/lib/libsmart_engine.a

      - name: Build eBPF (CGO=1)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          ver="${{ inputs.version }}"
          if [[ -z "$ver" ]]; then
            # eBPF generation may refresh embedded objects in the worktree.
            # Release identity must describe the checked-out commit, not generated-file dirtiness.
            ver="$(git describe --tags --always 2>/dev/null || echo dev)"
            ver="${ver#v}"
          fi
          # Gateway release profile: keep only protocols/features used by the
          # adaptive PBR deployment. Do not inherit the upstream "others"
          # bundle (OpenVPN, OCM/CCM, Cloudflared and USBIP add size without
          # being part of this target).
          tags="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_connection_history,with_tailscale,badlinkname,tfogo_checklinkname0,with_ebpf,smart_zig"
          ldflags="$(tr -d '\n' < release/LDFLAGS)"
          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            target="x86_64-linux-musl"
            if [[ "$GOARCH" == "arm64" ]]; then target="aarch64-linux-musl"; fi
            printf '#!/bin/sh\nexec zig cc -target %s "$@"\n' "$target" > /tmp/zig-musl-cc
            chmod +x /tmp/zig-musl-cc
            export CC=/tmp/zig-musl-cc
            tags="${tags},with_musl"
            extra_ldflags="-extldflags '-static'"
          elif [[ "$GOARCH" == "arm64" ]]; then
            export CC=aarch64-linux-gnu-gcc
            extra_ldflags=""
          else
            export CC=gcc
            extra_ldflags=""
          fi
          mkdir -p dist
          out="dist/sing-box-linux-${GOARCH}-${{ matrix.libc }}-ebpf"
          go build -trimpath -tags "$tags" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${ver}' ${ldflags} -s -w -buildid= ${extra_ldflags}" \
            -o "$out" ./cmd/sing-box
          chmod +x "$out"
          file "$out" | tee "${out}.file"
          (ldd "$out" 2>&1 || true) | tee "${out}.ldd" || true
          (
            cd dist
            sha256sum "$(basename "$out")" > "$(basename "$out").sha256"
          )
          if [[ "$GOARCH" == "amd64" && "${{ matrix.libc }}" == "glibc" ]]; then
            "$out" version | tee dist/version-ebpf.txt
            cat > /tmp/ebpf-check.json <<'EOF'
          {
            "log": {"level": "error"},
            "inbounds": [{
              "type": "ebpf",
              "tag": "ebpf-in",
              "network": ["tcp", "udp"],
              "dns_mode": "hijack",
              "shared_network": {"enabled": true, "include_interface": ["eth0"]}
            }],
            "outbounds": [{"type": "direct", "tag": "direct"}],
            "route": {"final": "direct"}
          }
          EOF
            "$out" check -c /tmp/ebpf-check.json
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ebpf-linux-${{ matrix.goarch }}-${{ matrix.libc }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ebpf]
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name 'sing-box-*' -o -name '*.sha256' -o -name 'version*.txt' -o -name '*.file' -o -name '*.ldd' \) \
            -exec cp -a {} release-assets/ \;
          ls -lah release-assets/
          ver="${{ inputs.version }}"
          if [[ -z "$ver" ]]; then
            ver="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              ver="$(git describe --tags --always | sed 's/^v//')"
            fi
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          tag="v${ver}"
          # prefer existing tag on push
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.assets.outputs.tag }}"
          ver="${{ steps.assets.outputs.version }}"
          notes="$(cat <<EOF
          ## sing-box adaptive ${ver}

          Pure **SagerNet 1.14.0-rc.1 snapshot** base + first-party Smart / eBPF v3 / provider / connection_history.

          ### Assets

          | Artifact | Notes |
          |----------|--------|
          | \`sing-box-linux-*-glibc-ebpf\` | Gateway build with eBPF v3 for glibc systems. |
          | \`sing-box-linux-*-musl-ebpf\` | Statically linked gateway build for musl systems. |

          See \`CHANGELOG.adaptive.md\` and \`README.md\`.

          ### Tags baked in
          - glibc: \`release/DEFAULT_BUILD_TAGS_OTHERS\` + \`with_ebpf\`
          - musl: above + \`with_musl\`
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --notes "$notes" || true
          else
            gh release create "$tag" release-assets/* \
              --title "adaptive ${ver}" \
              --notes "$notes"
          fi
