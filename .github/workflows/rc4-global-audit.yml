name: RC4 global audit

on:
  workflow_dispatch:
  push:
    paths:
      - "protocol/group/**"
      - "protocol/ebpf/**"
      - "common/ebpf/**"
      - "smart-engine/**"
      - "xdp-engine/**"
      - ".github/workflows/rc4-global-audit.yml"

permissions:
  contents: read

jobs:
  ebpf-provenance:
    name: Regenerate committed v2 eBPF object on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Install eBPF build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm make linux-libc-dev
      - name: Generate and verify v2 object
        working-directory: common/ebpf
        run: |
          set -euo pipefail
          make generate
          make check-v2-source
          readelf -S native/shared_network_v2.bpf.o | grep -E '\\.(maps|BTF|BTF\\.ext|sb\\.source)'
      - name: Publish regenerated object
        uses: actions/upload-artifact@v4
        with:
          name: rc4-v2-ebpf-object
          path: common/ebpf/native/shared_network_v2.bpf.o
          if-no-files-found: error

  go-regression:
    name: Smart and eBPF regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
      - name: Focused tests
        run: |
          make -C common/ebpf generate
          CGO_ENABLED=1 go test -tags with_ebpf ./protocol/group/... ./protocol/ebpf/... ./common/ebpf/...
      - name: Race tests for stateful paths
        run: CGO_ENABLED=1 go test -race -tags with_ebpf ./protocol/group/... ./protocol/ebpf/... ./common/ebpf/...
      - name: Static checks
        run: CGO_ENABLED=1 go vet -tags with_ebpf ./protocol/group/... ./protocol/ebpf/... ./common/ebpf/...

  smart-zig:
    name: Smart Zig conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Smart engine tests and Linux libraries
        working-directory: smart-engine
        run: |
          zig build test -Dcpu=baseline
          zig build -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseFast
