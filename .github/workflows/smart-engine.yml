name: Smart engine

on:
  push:
    paths:
      - "smart-engine/**"
      - "docs/smart-engine-architecture.md"
      - ".github/workflows/smart-engine.yml"
  pull_request:
    paths:
      - "smart-engine/**"
      - "docs/smart-engine-architecture.md"
      - ".github/workflows/smart-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig:
    name: Zig policy core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Test
        working-directory: smart-engine
        run: zig build test
      - name: Build release library
        working-directory: smart-engine
        run: zig build -Doptimize=ReleaseFast
      - name: Exercise C ABI
        working-directory: smart-engine
        run: |
          cat > /tmp/smart_engine_abi.c <<'EOF'
          #include "smart_engine.h"
          #include <stddef.h>
          int main(void) {
            if (smart_engine_abi_version() != SMART_ENGINE_ABI_VERSION) return 1;
            smart_engine_config cfg = {0, 0, 2, 0, 0};
            smart_engine *engine = smart_engine_create(cfg);
            if (!engine) return 2;
            smart_candidate incumbent = {1, .9, 20, 20, 1, 0, 4, 1, 1, 1};
            smart_candidate better = {2, .99, 5, 5, 1, 0, 4, 1, 1, 1};
            smart_decision first = smart_engine_choose(engine, &incumbent, 1, 0);
            smart_candidate candidates[2] = {incumbent, better};
            smart_decision pending = smart_engine_choose(engine, candidates, 2, 1);
            smart_decision switched = smart_engine_choose(engine, candidates, 2, 2);
            smart_engine_destroy(engine);
            if (!(first.selected_id == 1 && pending.selected_id == 1 &&
                  switched.selected_id == 2 && switched.switched == 1)) return 3;

            if (adaptive_engine_abi_version() != ADAPTIVE_ENGINE_ABI_VERSION) return 4;
            adaptive_engine_config adaptive_cfg = {0, 0, 2, 0, 1, 0};
            adaptive_engine *adaptive = adaptive_engine_create(adaptive_cfg);
            if (!adaptive) return 5;
            adaptive_candidate incumbent = {1, 0, 0, 0, 20, 0, 0, 1, 1, 0, 0};
            adaptive_candidate challenger = {2, 0, 0, 0, 5, 0, 0, 1, 1, 0, 0};
            adaptive_decision a_first = adaptive_engine_choose(adaptive, &incumbent, 1, 0);
            adaptive_candidate pair[2] = {incumbent, challenger};
            adaptive_decision a_pending = adaptive_engine_choose(adaptive, pair, 2, 1);
            adaptive_engine_forget(adaptive);
            adaptive_decision a_after_forget = adaptive_engine_choose(adaptive, &challenger, 1, 2);
            adaptive_engine_destroy(adaptive);
            return a_first.selected_id == 1 && a_pending.selected_id == 1 &&
                   a_after_forget.selected_id == 2 ? 0 : 6;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -I include /tmp/smart_engine_abi.c zig-out/lib/libsmart_engine.a -lm -o /tmp/smart_engine_abi
          /tmp/smart_engine_abi
      - name: Go/Zig conformance
        working-directory: smart-engine
        run: CGO_ENABLED=1 go test -tags smart_zig ./conformance
      - name: Compile production Smart Zig backend
        run: |
          set -euo pipefail
          cd smart-engine
          zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseFast
          test -s zig-out/lib/libsmart_engine.a
          cd ..
          CGO_ENABLED=1 go test -tags smart_zig ./protocol/group -run '^$'
      - name: Cross-build Linux libraries
        working-directory: smart-engine
        run: |
          zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-linux-gnu -Doptimize=ReleaseFast
      - name: Check C ABI header
        working-directory: smart-engine
        run: |
          printf '#include "smart_engine.h"\nint main(void) { return smart_engine_abi_version() == SMART_ENGINE_ABI_VERSION ? 0 : 1; }\n' > /tmp/smart_engine_abi.c
          cc -std=c11 -Wall -Wextra -Werror -I include -c /tmp/smart_engine_abi.c -o /tmp/smart_engine_abi.o
