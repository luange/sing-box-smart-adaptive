name: XDP engine

on:
  push:
    paths:
      - "xdp-engine/**"
      - "common/ebpf/Makefile"
      - "common/ebpf/v3/kern/**"
      - "docs/design/next-gen-xdp.md"
      - ".github/workflows/xdp-engine.yml"
  pull_request:
    paths:
      - "xdp-engine/**"
      - "common/ebpf/Makefile"
      - "common/ebpf/v3/kern/**"
      - "docs/design/next-gen-xdp.md"
      - ".github/workflows/xdp-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig:
    name: Zig XDP policy core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Test
        working-directory: xdp-engine
        run: zig build test -Dcpu=baseline
      - name: Build release library
        working-directory: xdp-engine
        run: zig build -Dcpu=baseline -Doptimize=ReleaseFast
      - name: Cross-build Linux libraries
        working-directory: xdp-engine
        run: |
          zig build -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseFast

  bpf:
    name: Linux XDP object and verifier surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Generate and validate XDP object
        working-directory: common/ebpf
        run: |
          set -euo pipefail
          make xdp-generate
          make xdp-check check-xdp-source
          readelf -h v3/kern/xdp.bpf.o | grep -E 'Class:.*ELF64|Machine:.*BPF'
          readelf -S v3/kern/xdp.bpf.o | grep -E '\.(maps|BTF|BTF\.ext|xdp|license|sb\.source)'
      - name: Verify policy boundaries in the object
        working-directory: common/ebpf
        run: |
          set -euo pipefail
          readelf -s v3/kern/xdp.bpf.o | grep -E 'sb_v3_xdp_ingress|v3_xsk_map|v3_xdp_control'
          ! grep -nE 'bpf_sk_assign|skb->mark|BPF_FUNC_sk_assign' v3/kern/xdp.bpf.c
      - name: Publish Linux XDP object for lab validation
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-v3-xdp-bpf-object
          path: common/ebpf/v3/kern/xdp.bpf.o
          if-no-files-found: error
